name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # xmllint valida los XML emitidos contra los XSD oficiales del SII
      # (src/lib/dte/xsd). Solo se instala acá: Docker/Coolify no cambia.
      - name: xmllint (validación XSD SII)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      # .env.example trae un DATABASE_URL de relleno: Prisma y Next lo
      # cargan igual que en local; ningún paso contacta la base real.
      - name: Archivo .env
        run: cp .env.example .env

      - name: Instalar dependencias
        run: npm ci

      - name: Prisma (validate + generate)
        run: |
          npm run db:validate
          npm run db:generate

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
